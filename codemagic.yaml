workflows:
  ios-unsigned:
    name: Build Unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "PrivateBrowser"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen 2>/dev/null || true

      - name: Clean and Generate Project
        script: |
          # Xóa xcodeproj cũ nếu có để tránh xung đột
          rm -rf *.xcodeproj
          xcodegen generate

      - name: Build Archive
        script: |
          echo "=== Debug: Current directory ==="
          pwd
          echo "=== Debug: Listing files ==="
          ls -la
          echo "=== Debug: Looking for xcodeproj ==="
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJ_FILE"
          
          if [ -z "$PROJ_FILE" ]; then
            echo "ERROR: No .xcodeproj found! xcodegen may have failed."
            echo "=== Debug: Checking if xcodegen exists ==="
            which xcodegen || echo "xcodegen not found"
            exit 1
          fi
          
          echo "=== Debug: Available schemes ==="
          xcodebuild -project "$PROJ_FILE" -list
          
          xcodebuild -project "$PROJ_FILE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/PrivateBrowser.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.privatebrowser.app" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/PrivateBrowser.xcarchive" -name "*.app" -type d | head -n 1)
          echo "App found at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in archive!"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          
          cd "$CM_BUILD_DIR"
          zip -r PrivateBrowser-Unsigned.ipa Payload
          rm -rf Payload
          
          mkdir -p build
          cp PrivateBrowser-Unsigned.ipa build/
          echo "=== IPA BUILD SUCCESSFUL ==="

    artifacts:
      - $CM_BUILD_DIR/build/PrivateBrowser-Unsigned.ipa
