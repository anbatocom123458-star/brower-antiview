name: PrivateBrowser
options:
  bundleIdPrefix: com.privatebrowser
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO

targets:
  PrivateBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources/PrivateBrowser
    settings:
      base:
        PRODUCT_NAME: PrivateBrowser
        PRODUCT_BUNDLE_IDENTIFIER: com.privatebrowser.app
        INFOPLIST_FILE: Sources/PrivateBrowser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "3.2"
        CURRENT_PROJECT_VERSION: "1"
